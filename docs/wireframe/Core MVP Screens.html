const seed=()=>({xp:380,daily:55,streak:6,freeze:1,name:'Minh Anh',tasks:[{id:1,title:'Hoàn thiện wireframe màn hình Dashboard',priority:'HIGH',due:'2026-11-07',description:'Rà soát luồng tạo nhanh và trạng thái công việc.',status:'TODO',earned:0},{id:2,title:'Đọc lại yêu cầu Sprint 1',priority:'MEDIUM',due:'2026-11-07',description:'',status:'IN_PROGRESS',earned:0},{id:3,title:'Chuẩn bị nội dung họp nhóm',priority:'LOW',due:'2026-11-08',description:'',status:'TODO',earned:0},{id:4,title:'Tổng hợp checklist MVP',priority:'MEDIUM',due:'2026-11-07',description:'',status:'COMPLETED',earned:20}],habits:[{id:1,title:'Đọc sách 30 phút',streak:6,frequency:'DAILY',target:7,done:false},{id:2,title:'Uống đủ 2 lít nước',streak:3,frequency:'DAILY',target:7,done:false},{id:3,title:'Vận động 20 phút',streak:5,frequency:'DAILY',target:7,done:true}],firstBadge:true,levelBadge:false,freezeUsed:false});
let signedIn=true; // Mặc định xem giao diện tài khoản demo đã đăng nhập.
let data=seed(),screen='dashboard',uiState='default',authTab='login',mobile=false,filter='ALL',lastFocus,notifyTimer,queued=[];const now='2026-11-07';
// Chỉ lưu trạng thái giao diện demo trong tab; không lưu mật khẩu/token.
const sessionKey='questline-demo-account-v1';
function saveDemoSession(){
  try {sessionStorage.setItem(sessionKey,JSON.stringify({signedIn,name:data.name,email:data.email||'minhanh@example.com'}));} catch (_) {}
}
try {
  const saved=JSON.parse(sessionStorage.getItem(sessionKey)||'null');
  if(saved&&typeof saved.signedIn==='boolean'){
    signedIn=saved.signedIn;
    if(signedIn){if(typeof saved.name==='string'&&saved.name.trim())data.name=saved.name;if(typeof saved.email==='string')data.email=saved.email;}
    screen=signedIn?'dashboard':'auth';
  }
} catch (_) {}
function initials(){return data.name.trim().split(/\s+/).slice(-2).map(w=>w[0]).join('').toUpperCase()}function level(){return Math.floor(Math.sqrt(data.xp)/10)+1}function threshold(l){return 100*Math.pow(l-1,2)}function pct(){return Math.min(100,(data.xp-threshold(level()))/(threshold(level()+1)-threshold(level()))*100)}
function toast(t){$('#toast').textContent=t;clearTimeout(notifyTimer);notifyTimer=setTimeout(()=>$('#toast').textContent='',4200)}
function header(){let l=level();$('#header').innerHTML=`<div class="level"><div class="level-icon">${l}</div><div><small>CẤP ${l} · CHIẾN BINH</small><b>Tiến bộ mỗi ngày</b></div></div><div class="xp"><div class="xp-meta"><span>${data.xp} / ${threshold(l+1)} XP</span><span>Cấp ${l+1}</span></div><div class="progress" role="progressbar" aria-label="Tiến trình lên cấp" aria-valuemin="${threshold(l)}" aria-valuemax="${threshold(l+1)}" aria-valuenow="${data.xp}"><span style="width:${pct()}%"></span></div></div><div class="streak"><b>${data.streak} ngày</b><small>DAILY STREAK</small></div><div class="freeze">◇ ${uiState==='nofreeze'?0:data.freeze} freeze<small>${data.freezeUsed?'Đã bảo vệ ngày bỏ lỡ':uiState==='nofreeze'||!data.freeze?'Không còn lượt khả dụng':'Bảo vệ chuỗi của bạn'}</small></div><div class="header-flame" role="img" aria-label="Ngọn lửa streak"><svg class="streak-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3c.5 4-3 5-3 8-1-1-1.5-2-1.5-3C6 10 5 12.2 5 15a7 7 0 0 0 14 0c0-3.5-2-6.5-6-12Z"/><path d="M12 13c.2 2-2 2.7-2 4.5a2 2 0 0 0 4 0c0-1.3-.7-2.5-2-4.5Z"/></svg></div>`}
function title(index,name,desc,action=''){return `<div class="page-title"><div><div class="eyebrow">${index} / YOUR DAILY QUEST</div><h1>${name}</h1><p>${desc}</p></div>${action||'<span class="date-tag">Thứ Bảy, 07 tháng 11 · Demo</span>'}</div>`}
function week(done=5){return `<div class="week">${['T2','T3','T4','T5','T6','T7','CN'].map((d,i)=>`<div class="day">${d}<i class="${i<done?'on':''} ${i===5?'today':''}">${i<done?'✓':i===5?'·':'–'}</i></div>`).join('')}</div>`}
function renderAccount(){
  $('#account-slot').innerHTML=signedIn
    ? `<div class="account-card"><div class="account-avatar" aria-label="Ảnh đại diện ${esc(data.name)}">${esc(initials())}</div><div class="account-info"><b>${esc(data.name)}</b><small>${esc(data.email||'minhanh@example.com')}</small></div></div><button id="logout" class="small logout-button" type="button" title="Đăng xuất">Đăng xuất</button>`
    : `<b>PC-GTD-01 · MVP</b><span>Bản giao diện mẫu</span><br><button class="small" data-screen="auth">Đăng nhập / Đăng ký</button>`;
}
function logout(){
  signedIn=false;data=seed();saveDemoSession();queued=[];filter='ALL';uiState='default';authTab='login';screen='auth';
  $('#state').value='default';$('#overlay').hidden=true;$('#modal').innerHTML='';
  render();window.scrollTo(0,0);toast('Đã đăng xuất khỏi bản thử');
}
function render(){renderAccount();header();document.querySelectorAll('[data-screen]').forEach(b=>{b.classList.toggle('active',b.dataset.screen===screen);b.setAttribute('aria-current',b.dataset.screen===screen?'page':'false')});$('#view').innerHTML=screenContent();$('#view').setAttribute('aria-busy',String(screen!=='auth'&&uiState==='loading'));$('#header').hidden=screen==='auth';bind();}
// Loading/error thay thế toàn bộ nội dung tab, không trộn với dữ liệu cũ.
function screenContent(){
  if(screen!=='auth'&&(uiState==='loading'||uiState==='error')){
    return `<section class="tab-state" aria-label="Trạng thái tải của trang">${stateContent()}</section>`;
  }
  return ({dashboard,habits,profile,auth}[screen])();
}
function stateContent(){if(uiState==='loading')return `<div class="card" role="status"><h2>Đang tải dữ liệu…</h2><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`;if(uiState==='error')return `<div class="empty" role="alert"><div class="empty-icon">!</div><h2>Chưa tải được dữ liệu</h2><p>Kết nối bị gián đoạn. Hãy thử lại để tiếp tục.</p><button class="primary" data-action="retry">Thử lại</button></div>`;return ''}
function taskRows(items){return `<div class="listbox">${items.map(t=>`<div class="task-row ${t.status==='COMPLETED'?'completed':''}"><button class="check ${t.status==='COMPLETED'?'done':''}" aria-label="${t.status==='COMPLETED'?'Chuyển về TODO':'Hoàn thành'}: ${esc(t.title)}" data-complete="${t.id}">${t.status==='COMPLETED'?'✓':''}</button><div class="task-text"><b>${esc(t.title)}</b><small><span class="priority ${t.priority}"></span>${pr[t.priority]}${t.due?' · '+t.due.split('-').reverse().join('/'): ' · Không hạn'}${t.status==='IN_PROGRESS'?' · Đang làm':''}</small></div><span class="reward">+${rewards[t.priority]} XP</span><button class="edit" data-edit="${t.id}" aria-label="Sửa ${esc(t.title)}">✎</button></div>`).join('')}</div>`}
function dashboard(){let tasks=data.tasks.filter(t=>filter==='ALL'||t.priority===filter),todo=tasks.filter(t=>t.status!=='COMPLETED'),completed=tasks.filter(t=>t.status==='COMPLETED');return title('01','Hôm nay, tiến thêm một bước.','Tập trung vào điều quan trọng. Mỗi việc nhỏ đều có giá trị.')+`<div class="grid"><div><section class="card"><div class="eyebrow">TẠO NHANH / NHẬP TIÊU ĐỀ VÀ ENTER</div><form id="quick" novalidate><div class="quick"><div class="task-title"><label for="task-title">Tên công việc</label><input id="task-title" name="title" placeholder="Bạn muốn hoàn thành điều gì?" maxlength="200" autocomplete="off" aria-describedby="quick-error"></div><div><label for="priority">Ưu tiên</label><select id="priority" name="priority"><option value="LOW">Thấp · 10 XP</option><option value="MEDIUM" selected>Vừa · 20 XP</option><option value="HIGH">Cao · 30 XP</option></select></div><div><label for="due">Hạn chót</label><input id="due" type="date" name="due" aria-label="Hạn chót (không bắt buộc)"></div><button class="primary">＋ Thêm</button></div><div id="quick-error" class="error" role="alert"></div></form><p class="helper">Tiêu đề bắt buộc · Hạn chót tùy chọn · Ưu tiên mặc định: Vừa</p></section><div class="toolbar"><span class="screen-index">CÔNG VIỆC CỦA BẠN</span><select id="priority-filter" aria-label="Lọc ưu tiên">${[['ALL','Tất cả ưu tiên'],['HIGH','Ưu tiên cao'],['MEDIUM','Ưu tiên vừa'],['LOW','Ưu tiên thấp']].map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select></div>${stateContent()||((uiState==='empty'||!data.tasks.length)?`<div class="empty"><div class="empty-icon">✓</div><h2>Hành trình bắt đầu từ một việc nhỏ</h2><p>Thêm công việc đầu tiên của bạn và nhận XP khi hoàn thành.</p><button class="primary" data-action="focus-task">＋ Tạo công việc đầu tiên</button></div>`:(!tasks.length?'<div class="empty"><h2>Không có việc phù hợp</h2><p>Đổi bộ lọc để xem các công việc khác.</p><button data-action="clear-filter">Xóa bộ lọc</button></div>':`<div class="section-line"><h2>TODO</h2><span class="count">${todo.length}</span></div>${todo.length?taskRows(todo):'<p class="helper">Bạn đã hoàn thành tất cả công việc trong nhóm này.</p>'}<div class="section-line"><h2>COMPLETED</h2><span class="count">${completed.length}</span></div>${completed.length?taskRows(completed):'<p class="helper">Công việc hoàn thành sẽ xuất hiện ở đây.</p>'}`))}</div><aside><section class="card flat"><div class="eyebrow">NHỊP ĐỘ TUẦN NÀY</div><h2>Đều đặn hơn mỗi ngày.</h2>${week()}<p class="helper">Hoàn thành ít nhất 1 task hoặc check-in để duy trì chuỗi ngày.</p></section><section class="card"><div class="eyebrow">XP HÔM NAY</div><div class="metric">${uiState==='cap'?200:data.daily}<span style="font-size:14px;font-weight:400;color:var(--muted)"> / 200 XP</span></div><div class="progress"><span style="width:${(uiState==='cap'?200:data.daily)/2}%"></span></div><p class="helper">${uiState==='cap'||data.daily>=200?'Đã đạt trần hôm nay. Bạn vẫn có thể hoàn thành công việc, nhưng sẽ không nhận thêm XP.':'Nhận 10 / 20 / 30 XP theo ưu tiên. Check-in thói quen nhận 15 XP.'}</p></section><section class="card"><div class="eyebrow">DẤU MỐC TIẾP THEO</div><h3>7 ngày bền bỉ</h3><p>Thêm một ngày đều đặn để chạm đến huy hiệu chuỗi 7 ngày.</p><button class="small" data-screen="profile">Xem bộ sưu tập ↗</button></section></aside></div>`}
function habits(){return title('02','Xây thói quen, giữ nhịp độ.','Một lần check-in, thêm một bước tiến.',`<button class="primary" data-action="new-habit">＋ Thói quen mới</button>`)+`<div class="grid"><div>${stateContent()||(uiState==='empty'||!data.habits.length?`<div class="empty"><div class="empty-icon">↻</div><h2>Gieo một thói quen nhỏ</h2><p>Chọn một việc bạn muốn lặp lại và bắt đầu theo dõi.</p><button class="primary" data-action="new-habit">＋ Tạo thói quen</button></div>`:data.habits.map(h=>`<article class="habit-row"><div><h3>${esc(h.title)}</h3><p>${h.frequency==='DAILY'?'Hằng ngày':'Hằng tuần'} · Mục tiêu ${h.target} ngày / chu kỳ</p><div class="habit-foot"><span><b>${h.streak} ngày</b> liên tiếp</span>${week(h.done?6:5)}</div></div><div><button class="${h.done?'':'primary'}" data-checkin="${h.id}" ${h.done?'disabled':''}>${h.done?'✓ Đã check-in':'✓ Check-in · +15 XP'}</button><p class="helper">${h.done?'Đã ghi nhận hôm nay':'Mỗi thói quen: 1 lần / ngày'}</p><button class="quiet small danger" data-remove-habit="${h.id}">Ngừng theo dõi</button></div></article>`).join(''))}</div><aside><section class="card flat"><div class="eyebrow">DAILY STREAK</div><div class="metric">${data.streak} <span style="font-size:14px">ngày</span></div><p>Giữ lời hứa với bản thân, từng ngày một.</p><p class="helper">Chuỗi tài khoản được hệ thống tổng hợp theo ngày Việt Nam (UTC+7). Check-in không tăng chuỗi tài khoản nhiều lần trong cùng ngày.</p></section><section class="card"><div class="eyebrow">STREAK PROTECTION</div><h3>◇ ${uiState==='nofreeze'?0:data.freeze} lượt đóng băng</h3><p>Bảo vệ chuỗi khi bạn bỏ lỡ một ngày.</p><button role="switch" aria-checked="${data.freezeUsed}" class="full ${data.freezeUsed?'':'primary'}" data-action="freeze" ${data.freezeUsed?'disabled':''}>${data.freezeUsed?'✓ Ngày bỏ lỡ đã được bảo vệ':'Kích hoạt bảo vệ…'}</button></section></aside></div>`}
function badge(symbol,title,desc,status,progress,date){return `<article class="badge ${status?'':'locked'}"><div class="badge-symbol">${symbol}</div><h3>${title}</h3><p>${desc}</p>${status?`<span class="pill">✓ Đã mở khóa</span><br><small>${date}</small>`:`<div class="progress"><span style="width:${progress}%"></span></div><small>${title==='Cột mốc cấp 5'?level()+' / 5 cấp':data.streak+' / 7 ngày'} · Chưa mở khóa</small>`}</article>`}
function profile(){return `<div class="toolbar"><button class="small" data-action="level-demo">Xem mẫu Level Up</button><button class="small" data-action="badge-demo">Xem mẫu Badge Unlock</button></div>`+title('03','Thành quả của sự bền bỉ.','Nhìn lại hành trình. Sẵn sàng cho cột mốc tiếp theo.')+`<section class="card profile-card"><div class="profile-avatar">${esc(initials())}</div><div><h2 style="margin:0">${esc(data.name)}</h2><p class="helper">${esc(data.email||'minhanh@example.com')}</p><span class="pill">Chiến binh · Cấp ${level()}</span></div><div class="stats-grid"><div><b>${data.xp.toLocaleString('vi-VN')}</b><small>XP toàn thời gian</small></div><div><b>${data.streak} ngày</b><small>Chuỗi hiện tại</small></div><div><b style="font-size:17px">01/11/2026</b><small>Ngày gia nhập · Demo</small></div></div></section>${stateContent()||`<div class="section-line"><h2>ĐÃ MỞ KHÓA</h2><span class="count">${uiState==='empty'?0:1+(data.levelBadge?1:0)}</span></div>${uiState==='empty'?'<div class="empty"><h2>Huy hiệu đầu tiên đang chờ bạn</h2><p>Hoàn thành 1 công việc để mở khóa “Khởi đầu nan”.</p><button data-screen="dashboard" class="primary">Đến công việc</button></div>':`<div class="badgegrid">${badge('⚑','Khởi đầu nan','Hoàn thành công việc đầu tiên.',true,100,'Mở khóa 02/11/2026')}${data.levelBadge?badge('♜','Cột mốc cấp 5','Đạt cấp độ 5.',true,100,'Mở khóa trong bản thử'):''}</div>`}<div class="section-line"><h2>CỘT MỐC PHÍA TRƯỚC</h2><span class="count">${data.levelBadge?1:2}</span></div><div class="badgegrid">${badge('♨','7 ngày bền bỉ','Duy trì daily streak trong 7 ngày.',false,data.streak/7*100)}${!data.levelBadge?badge('♜','Cột mốc cấp 5','Đạt cấp độ 5.',false,level()/5*100):''}</div><div class="demo-note">Tên cấp bậc “Chiến binh” và hình huy hiệu là nhãn minh họa. Mã FIRST_TASK / STREAK_7 / LEVEL_5 bám DOC-11; bộ huy hiệu và tên cấp chính thức chờ PO xác nhận.</div>`}`}
function auth(){return `<section class="auth-only card"><h1>${authTab==='login'?'Chào mừng trở lại.':'Bắt đầu hành trình.'}</h1><p>${authTab==='login'?'Tiếp tục những mục tiêu còn dang dở.':'Tạo tài khoản để bắt đầu những mục tiêu mới.'}</p><div class="tabs"><button type="button" data-auth="login" class="${authTab==='login'?'active':''}">Đăng nhập</button><button type="button" data-auth="register" class="${authTab==='register'?'active':''}">Đăng ký</button></div><form id="auth-form" novalidate>${authTab==='register'?field('fullName','Họ và tên','text','Nguyễn Minh Anh'):''}${field('email','Email','email','ban@example.com')}${field('password','Mật khẩu','password','Nhập mật khẩu')}<button type="button" id="password-toggle" class="quiet small" aria-controls="password" aria-pressed="false">Hiện mật khẩu</button><button class="primary full">${authTab==='login'?'Đăng nhập':'Tạo tài khoản'}</button><div class="error" id="auth-error" role="alert"></div></form><div class="demo-note">Đăng nhập mô phỏng, chưa kết nối máy chủ. Chỉ lưu tên, email và trạng thái demo trong tab; không lưu mật khẩu.</div></section>`}
function field(id,label,type,placeholder,value=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}" aria-describedby="${id}-error" autocomplete="${id==='password'?(authTab==='register'?'new-password':'current-password'):id==='fullName'?'name':'email'}"><div class="error" id="${id}-error" role="alert"></div></div>`}
function award(n){const old=level(),earned=Math.min(n,Math.max(0,200-data.daily));data.xp+=earned;data.daily+=earned;if(level()>old)queued.push({type:'level',value:level()});if(level()>=5&&!data.levelBadge){data.levelBadge=true;queued.push({type:'badge',value:'Cột mốc cấp 5'})}return earned}
function nextCelebration(){if(queued.length){const n=queued.shift();celebrate(n.type,n.value)}}
function complete(id){const t=data.tasks.find(t=>t.id===id);if(t.status==='COMPLETED'){t.status='TODO';data.xp=Math.max(0,data.xp-t.earned);data.daily=Math.max(0,data.daily-t.earned);toast(`Đã chuyển về TODO · −${t.earned} XP thực nhận`);t.earned=0}else{t.status='COMPLETED';t.earned=award(rewards[t.priority]);toast(t.earned?`Hoàn thành! +${t.earned} XP`:'Đã hoàn thành · Đạt trần XP hôm nay')}render();nextCelebration()}
function openModal(html){lastFocus=document.activeElement;$('#modal').innerHTML=html;$('#overlay').hidden=false;$('#modal').querySelector('input,button,select')?.focus();$('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){ $('#overlay').hidden=true;$('#modal').innerHTML='';lastFocus?.focus();if(queued.length)setTimeout(nextCelebration,100)}
function modalHead(t){return `<div class="modal-head"><h2 id="modal-title">${t}</h2><button class="quiet small" data-close aria-label="Đóng">✕</button></div>`}
function celebrate(type,value){openModal(`${modalHead(type==='level'?'Cấp độ mới!':'Huy hiệu mới!')}<div class="celebrate"><div class="badge-symbol">${type==='level'?'♜':'⚑'}</div><div class="eyebrow">${type==='level'?'LEVEL UP':'BADGE UNLOCKED'}</div><h1>${type==='level'?'Chiến binh · Cấp '+value:esc(value)}</h1><p>${type==='level'?'Từng nỗ lực nhỏ đang tạo nên sự khác biệt.':'Một dấu mốc mới trên hành trình của bạn.'}</p><button class="primary full" data-close>Tiếp tục hành trình</button></div>`)}
function editTask(id){const t=data.tasks.find(t=>t.id===id);openModal(`${modalHead('Chỉnh sửa công việc')}<form id="edit-form" novalidate><div class="field"><label for="edit-title">Tiêu đề</label><input id="edit-title" maxlength="200" value="${esc(t.title)}" aria-describedby="edit-error"><div id="edit-error" class="error" role="alert"></div></div><div class="field"><label for="edit-desc">Mô tả</label><textarea id="edit-desc" rows="3">${esc(t.description)}</textarea></div><div class="field"><label for="edit-priority">Ưu tiên</label><select id="edit-priority">${Object.keys(pr).map(p=>`<option ${t.priority===p?'selected':''} value="${p}">${pr[p]} · ${rewards[p]} XP</option>`).join('')}</select></div><div class="field"><label for="edit-due">Hạn chót</label><input id="edit-due" type="date" value="${t.due}"></div><div class="field"><label for="edit-status">Trạng thái</label><select id="edit-status">${['TODO','IN_PROGRESS','COMPLETED'].map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><p class="helper">Đổi ưu tiên sau khi hoàn thành không cộng thêm XP. Chuyển khỏi COMPLETED thu hồi XP đã nhận.</p><div class="modal-actions"><button type="button" class="quiet danger" id="delete-task">Xóa</button><button type="button" data-close>Hủy</button><button class="primary">Lưu thay đổi</button></div></form>`);$('#edit-form').onsubmit=e=>{e.preventDefault();let v=$('#edit-title').value.trim();if(!v){$('#edit-error').textContent='Vui lòng nhập tiêu đề.';$('#edit-title').setAttribute('aria-invalid','true');$('#edit-title').focus();return}let previous=t.status,next=$('#edit-status').value;t.title=v;t.description=$('#edit-desc').value;t.priority=$('#edit-priority').value;t.due=$('#edit-due').value;if(previous==='COMPLETED'&&next!=='COMPLETED'){data.xp-=t.earned;data.daily=Math.max(0,data.daily-t.earned);t.earned=0}if(previous!=='COMPLETED'&&next==='COMPLETED')t.earned=award(rewards[t.priority]);t.status=next;closeModal();render();toast('Đã lưu thay đổi');nextCelebration()};$('#delete-task').onclick=()=>{openModal(`${modalHead('Xóa công việc?')}<p>“${esc(t.title)}” sẽ được xóa khỏi danh sách trong bản thử.</p><p class="helper">Demo không thu hồi XP khi xóa task đã hoàn thành; quy tắc production cần PO/Backend chốt.</p><div class="modal-actions"><button data-close>Hủy</button><button class="primary" id="confirm-delete">Xác nhận xóa</button></div>`);$('#confirm-delete').onclick=()=>{data.tasks=data.tasks.filter(x=>x.id!==id);closeModal();render();toast('Đã xóa công việc')}}}
function freeze(){let count=uiState==='nofreeze'?0:data.freeze;openModal(`${modalHead(count?'Bảo vệ chuỗi ngày?':'Bạn đã hết lượt đóng băng')}<div class="celebrate"><div class="badge-symbol">◇</div><h2>${count?'Giữ lại chuỗi '+data.streak+' ngày':'Không còn freeze khả dụng'}</h2><p>${count?'Dùng 1 lượt để bảo vệ ngày bỏ lỡ 06/11/2026 trong tình huống demo. Không nhận XP và không tăng chuỗi.':'Bạn không thể bảo vệ ngày bỏ lỡ bằng freeze lúc này.'}</p><span class="pill outline">${count} lượt còn lại${count?' → '+(count-1)+' lượt':''}</span></div><div class="modal-actions"><button data-close>${count?'Để sau':'Đã hiểu'}</button>${count?'<button id="confirm-freeze" class="primary">Dùng 1 lượt</button>':''}</div>`);if(count)$('#confirm-freeze').onclick=()=>{data.freeze--;data.freezeUsed=true;closeModal();render();toast('Đã dùng 1 freeze · Chuỗi 6 ngày được giữ nguyên')}}
function newHabit(){openModal(`${modalHead('Tạo thói quen')}<form id="habit-form" novalidate><div class="field"><label for="habit-title">Tên thói quen</label><input id="habit-title" maxlength="200" placeholder="Ví dụ: Đọc sách 30 phút" aria-describedby="habit-error"><div class="error" id="habit-error" role="alert"></div></div><div class="field"><label for="habit-frequency">Chu kỳ</label><select id="habit-frequency"><option value="DAILY">Hằng ngày</option><option value="WEEKLY">Hằng tuần</option></select></div><div class="field"><label for="habit-target">Mục tiêu số ngày / chu kỳ</label><input id="habit-target" type="number" min="1" max="7" value="7"></div><p class="helper">Giới hạn mục tiêu 1–7 là giả định UI; weekly scheduling cần PO xác nhận.</p><div class="modal-actions"><button type="button" data-close>Hủy</button><button class="primary">Tạo thói quen</button></div></form>`);$('#habit-form').onsubmit=e=>{e.preventDefault();const title=$('#habit-title').value.trim(),target=Number($('#habit-target').value);if(!title||!Number.isInteger(target)||target<1||target>7){$('#habit-error').textContent=!title?'Vui lòng nhập tên thói quen.':'Mục tiêu phải là số nguyên từ 1 đến 7.';return}data.habits.push({id:Date.now(),title,streak:0,frequency:$('#habit-frequency').value,target,done:false});uiState='default';$('#state').value='default';closeModal();render();toast('Đã tạo thói quen')}}
function bind(){
if($('#logout'))$('#logout').onclick=logout;
if($('#password-toggle'))$('#password-toggle').onclick=()=>{const input=$('#password'),button=$('#password-toggle'),show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'Ẩn mật khẩu':'Hiện mật khẩu';button.setAttribute('aria-pressed',String(show))};
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;render();window.scrollTo(0,0)});document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{authTab=b.dataset.auth;render()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>complete(Number(b.dataset.complete)));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTask(Number(b.dataset.edit)));document.querySelectorAll('[data-checkin]').forEach(b=>b.onclick=()=>{const h=data.habits.find(h=>h.id===Number(b.dataset.checkin));if(h.done)return;h.done=true;h.streak++;const xp=award(15);render();toast(xp?`Đã check-in · +${xp} XP`:'Đã check-in · Đạt trần XP hôm nay');nextCelebration()});document.querySelectorAll('[data-remove-habit]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.removeHabit);openModal(`${modalHead('Ngừng theo dõi thói quen?')}<p>Thói quen sẽ không xuất hiện trong danh sách đang theo dõi.</p><div class="modal-actions"><button data-close>Hủy</button><button class="primary" id="remove-habit">Ngừng theo dõi</button></div>`);$('#remove-habit').onclick=()=>{data.habits=data.habits.filter(h=>h.id!==id);closeModal();render();toast('Đã ngừng theo dõi')}});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{switch(b.dataset.action){case'retry':uiState='default';$('#state').value=uiState;render();break;case'focus-task':$('#task-title').focus();break;case'clear-filter':filter='ALL';render();break;case'freeze':freeze();break;case'new-habit':newHabit();break;case'level-demo':celebrate('level',level()+1);break;case'badge-demo':celebrate('badge','Khởi đầu nan');break}});if($('#quick'))$('#quick').onsubmit=e=>{e.preventDefault();let title=$('#task-title').value.trim();if(!title){$('#quick-error').textContent='Vui lòng nhập tên công việc (tối đa 200 ký tự).';$('#task-title').setAttribute('aria-invalid','true');$('#task-title').focus();return}data.tasks.push({id:Date.now(),title,priority:$('#priority').value,due:$('#due').value,description:'',status:'TODO',earned:0});uiState='default';filter='ALL';$('#state').value='default';render();$('#task-title').focus();toast('Đã thêm công việc')};if($('#priority-filter'))$('#priority-filter').onchange=e=>{filter=e.target.value;render()};if($('#auth-form'))$('#auth-form').onsubmit=e=>{e.preventDefault();let valid=true;for(const id of ['fullName','email','password']){const el=$('#'+id);if(!el)continue;let msg='';if(!el.value.trim())msg='Vui lòng nhập '+({fullName:'họ và tên',email:'email',password:'mật khẩu'}[id])+'.';else if(id==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value))msg='Email chưa đúng định dạng.';$('#'+id+'-error').textContent=msg;el.setAttribute('aria-invalid',String(!!msg));if(msg)valid=false}if(valid){if(authTab==='register')data.name=$('#fullName').value.trim();data.email=$('#email').value.trim();signedIn=true;saveDemoSession();$('#password').value='';screen='dashboard';render();toast('Đã đăng nhập tài khoản demo')}else $('#auth-form [aria-invalid="true"]').focus()}}
$('#state').onchange=e=>{uiState=e.target.value;if(uiState==='cap')data.daily=200;render()};$('#viewport').onclick=()=>{mobile=!mobile;$('#frame').classList.toggle('review-mobile',mobile);$('#viewport').textContent=mobile?'Xem desktop':'Xem mobile'};$('#reset').onclick=()=>{const identity={name:data.name,email:data.email};data=seed();if(signedIn)Object.assign(data,identity);queued=[];filter='ALL';uiState='default';$('#state').value=uiState;render();toast('Đã đặt lại dữ liệu mẫu')};$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){let a=[...$('#modal').querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')].filter(x=>x.offsetParent!==null),f=a[0],l=a[a.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});render();
</script></body></html>
