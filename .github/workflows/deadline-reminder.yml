name: "Daily Deadline Reminder"

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 08:00 AM VN Time (UTC+7)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  deadline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deadlines and alert assignees
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const now = new Date();

            console.log(`Starting deadline check at UTC: ${now.toISOString()}`);

            // Current date in Vietnam timezone (UTC+7)
            const vnDateString = now.toLocaleDateString('en-CA', { timeZone: 'Asia/Ho_Chi_Minh' }); // Format: YYYY-MM-DD
            const [curYear, curMonth, curDay] = vnDateString.split('-').map(Number);
            const todayUtc = new Date(Date.UTC(curYear, curMonth - 1, curDay));
            console.log(`Current date in Vietnam (UTC+7): ${vnDateString}`);

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open'
            });

            const openIssues = allIssues.filter(item => !item.pull_request);
            console.log(`Found ${openIssues.length} open issues to check.`);

            const twentyHoursAgo = new Date(now.getTime() - 20 * 60 * 60 * 1000);

            for (const issue of openIssues) {
              const body = issue.body || '';
              // Match DD/MM/YYYY
              const match = body.match(/Deadline:.*?(\d{2})\/(\d{2})\/(\d{4})/i);
              if (!match) continue;

              const [_, dayStr, monthStr, yearStr] = match;
              const deadlineDate = new Date(Date.UTC(Number(yearStr), Number(monthStr) - 1, Number(dayStr)));
              const diffDays = Math.round((deadlineDate - todayUtc) / (1000 * 60 * 60 * 24));

              console.log(`Issue #${issue.number} ("${issue.title}") -> Deadline: ${dayStr}/${monthStr}/${yearStr}, Diff in days: ${diffDays}`);

              const assignees = issue.assignees || [];
              const mentionString = assignees.length > 0 
                ? assignees.map(a => `@${a.login}`).join(' ')
                : 'nhóm phát triển';

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number
              });

              // Case 1: 0 <= diffDays <= 1 (Within 24h or today is deadline)
              if (diffDays >= 0 && diffDays <= 1) {
                const recentlyReminded = comments.some(c => 
                  c.body && c.body.includes('Nhắc nhở Deadline') && new Date(c.created_at) > twentyHoursAgo
                );

                if (!recentlyReminded) {
                  const reminderBody = `⏰ **Nhắc nhở Deadline:** Công việc này có hạn hoàn thành vào ngày **${dayStr}/${monthStr}/${yearStr}** (còn chưa đầy 24h). Nhờ ${mentionString} kiểm tra tiến độ và tạo Pull Request nhé!`;
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: reminderBody
                  });
                  console.log(`Posted 24h deadline reminder on Issue #${issue.number}`);
                } else {
                  console.log(`Issue #${issue.number} already received a deadline reminder within 20 hours.`);
                }
              }
              // Case 2: diffDays < 0 (Overdue)
              else if (diffDays < 0) {
                const recentlyAlerted = comments.some(c => 
                  c.body && c.body.includes('Cảnh báo quá hạn') && new Date(c.created_at) > twentyHoursAgo
                );

                if (!recentlyAlerted) {
                  const overdueBody = `⚠️ **Cảnh báo quá hạn:** Công việc này đã quá hạn hoàn thành (Hạn chót: **${dayStr}/${monthStr}/${yearStr}**). Đề nghị ${mentionString} cập nhật tình trạng tiến độ hoặc báo cáo trở ngại nếu cần hỗ trợ!`;
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: overdueBody
                  });
                  console.log(`Posted overdue warning on Issue #${issue.number}`);
                } else {
                  console.log(`Issue #${issue.number} already received an overdue alert within 20 hours.`);
                }
              }
            }
