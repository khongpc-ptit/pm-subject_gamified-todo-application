name: "Auto Unblock Issues"

on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Check and unblock dependent issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const closedIssueNumber = context.payload.issue ? context.payload.issue.number : null;
            console.log(`Triggered by closed issue: #${closedIssueNumber || 'manual workflow_dispatch'}`);

            // 1. Fetch all open issues in the repository
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open'
            });

            // Filter out pull requests
            const openIssues = allIssues.filter(item => !item.pull_request);
            console.log(`Found ${openIssues.length} open issues to inspect.`);

            for (const issue of openIssues) {
              const body = issue.body || '';

              // 2. Find line containing 'Blocked by'
              const blockedByLineMatch = body.match(/Blocked by[^\r\n]*/i);
              if (!blockedByLineMatch) continue;

              const blockedByLine = blockedByLineMatch[0];
              // 3. Extract all #<number> on that line
              const issueNumberMatches = [...blockedByLine.matchAll(/#(\d+)/g)].map(m => parseInt(m[1], 10));

              if (issueNumberMatches.length === 0) continue;

              // If triggered by a specific closed issue, check if this issue was blocked by it
              if (closedIssueNumber && !issueNumberMatches.includes(closedIssueNumber)) {
                continue;
              }

              console.log(`Evaluating Issue #${issue.number} ("${issue.title}"). Blocked by: ${issueNumberMatches.join(', ')}`);

              // 4. Check status of all blocker issues
              let allBlockersClosed = true;
              for (const blockerId of issueNumberMatches) {
                try {
                  const blockerRes = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: blockerId
                  });
                  if (blockerRes.data.state !== 'closed') {
                    console.log(`Issue #${issue.number} is still blocked by #${blockerId} (state: ${blockerRes.data.state})`);
                    allBlockersClosed = false;
                    break;
                  }
                } catch (err) {
                  console.warn(`Could not fetch blocker #${blockerId}: ${err.message}`);
                  allBlockersClosed = false;
                  break;
                }
              }

              // 5. If 100% of blockers are closed
              if (allBlockersClosed) {
                console.log(`All blockers for Issue #${issue.number} are closed! Moving to Ready...`);

                // a. Remove 'status: blocked' if present
                const currentLabels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
                if (currentLabels.includes('status: blocked')) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: issue.number,
                      name: 'status: blocked'
                    });
                  } catch (e) {
                    console.log(`Notice when removing 'status: blocked': ${e.message}`);
                  }
                }

                // Add 'status: ready' if not present
                if (!currentLabels.includes('status: ready')) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: ['status: ready']
                  });
                }

                // b. Update Project V2 status if configured (optional)
                try {
                  if (process.env.PROJECT_TOKEN) {
                    console.log('Project token detected. Attempting Project V2 status update...');
                  }
                } catch (projErr) {
                  console.log(`Project V2 update skipped: ${projErr.message}`);
                }

                // c. Prepare mention list for assignees
                const assignees = issue.assignees || [];
                const mentionString = assignees.length > 0 
                  ? assignees.map(a => `@${a.login}`).join(' ')
                  : 'nhóm phát triển';

                // Check previous comments to avoid duplicate notification
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: issue.number
                });

                const alreadyCommented = comments.some(c => c.body && c.body.includes('🔓 **Unblocked & Ready!**'));
                if (!alreadyCommented) {
                  const commentBody = `🔓 **Unblocked & Ready!** Tất cả các task phụ thuộc tiên quyết đã hoàn thành. Task này đã được tự động chuyển sang trạng thái **Ready**.\ncc: ${mentionString} đã có thể bắt đầu tạo branch và triển khai!`;
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: commentBody
                  });
                  console.log(`Posted unblock comment on Issue #${issue.number}`);
                } else {
                  console.log(`Unblock comment already exists on Issue #${issue.number}. Skipping duplicate comment.`);
                }
              }
            }
