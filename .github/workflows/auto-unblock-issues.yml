name: "Auto Unblock & Project V2 Sync"

on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:

permissions:
  issues: write
  repository-projects: write
  contents: read

jobs:
  unblock-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Unblock and Sync Project V2 Status
        uses: actions/github-script@v7
        env:
          DEFAULT_PROJECT_ID: ${{ vars.PROJECT_ID || '' }}
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const action = context.payload.action;
            const eventName = context.eventName;

            console.log(`Executing workflow for event: "${eventName}", action: "${action || 'none'}"`);

            // Helper 1: Update Project V2 column status via GraphQL
            async function setProjectStatus(issueNodeId, targetStatusName) {
              try {
                const query = `
                  query($issueId: ID!) {
                    node(id: $issueId) {
                      ... on Issue {
                        projectItems(first: 10) {
                          nodes {
                            id
                            project {
                              id
                              field(name: "Status") {
                                ... on ProjectV2SingleSelectField {
                                  id
                                  options {
                                    id
                                    name
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `;

                const res = await github.graphql(query, { issueId: issueNodeId });
                let projectItems = res?.node?.projectItems?.nodes || [];

                // If issue is not in any Project V2 yet and a default project ID is configured
                if (projectItems.length === 0 && process.env.DEFAULT_PROJECT_ID) {
                  console.log(`Issue ${issueNodeId} not in project yet. Adding to default project: ${process.env.DEFAULT_PROJECT_ID}`);
                  const addMutation = `
                    mutation($projectId: ID!, $contentId: ID!) {
                      addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                        item {
                          id
                          project {
                            id
                            field(name: "Status") {
                              ... on ProjectV2SingleSelectField {
                                id
                                options {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `;
                  const addRes = await github.graphql(addMutation, {
                    projectId: process.env.DEFAULT_PROJECT_ID,
                    contentId: issueNodeId
                  });
                  const addedItem = addRes?.addProjectV2ItemById?.item;
                  if (addedItem) {
                    projectItems.push(addedItem);
                  }
                }

                if (projectItems.length === 0) {
                  console.log(`Notice: Issue ${issueNodeId} is not linked to any Project V2 board. Skipping project card move.`);
                  return;
                }

                for (const item of projectItems) {
                  const statusField = item.project?.field;
                  if (!statusField || !statusField.options) {
                    console.log(`Project ${item.project?.id} does not have a single-select "Status" field.`);
                    continue;
                  }

                  // Match option name (case-insensitive)
                  const targetOption = statusField.options.find(
                    opt => opt.name.trim().toLowerCase() === targetStatusName.trim().toLowerCase()
                  );

                  if (!targetOption) {
                    console.log(`Option "${targetStatusName}" not found in Status field. Available options: ${statusField.options.map(o => o.name).join(', ')}`);
                    continue;
                  }

                  const updateMutation = `
                    mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { singleSelectOptionId: $optionId }
                      }) {
                        projectV2Item {
                          id
                        }
                      }
                    }
                  `;

                  await github.graphql(updateMutation, {
                    projectId: item.project.id,
                    itemId: item.id,
                    fieldId: statusField.id,
                    optionId: targetOption.id
                  });

                  console.log(`Updated Project item ${item.id} Status to "${targetOption.name}" (${targetOption.id})`);
                }
              } catch (err) {
                console.warn(`Project V2 status update note (token scope/permissions): ${err.message}`);
              }
            }

            // Helper 2: Evaluate Blocked state of an issue
            async function evaluateIssueBlockedState(issue) {
              const body = issue.body || '';
              const blockedByLineMatch = body.match(/Blocked by[^\r\n]*/i);
              if (!blockedByLineMatch) {
                return { isBlocked: false, blockers: [], openBlockers: [] };
              }

              const blockedByLine = blockedByLineMatch[0];
              const issueNumbers = [...blockedByLine.matchAll(/#(\d+)/g)].map(m => parseInt(m[1], 10));

              if (issueNumbers.length === 0) {
                return { isBlocked: false, blockers: [], openBlockers: [] };
              }

              const openBlockers = [];
              for (const blockerId of issueNumbers) {
                try {
                  const blockerRes = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: blockerId
                  });
                  if (blockerRes.data.state === 'open') {
                    openBlockers.push(blockerId);
                  }
                } catch (err) {
                  console.warn(`Could not fetch blocker #${blockerId}: ${err.message}`);
                  openBlockers.push(blockerId);
                }
              }

              return {
                isBlocked: openBlockers.length > 0,
                blockers: issueNumbers,
                openBlockers
              };
            }

            // Branch A: Triggered when an issue is opened, edited, or reopened
            if (['opened', 'edited', 'reopened'].includes(action) && context.payload.issue) {
              const currentIssue = context.payload.issue;
              console.log(`[Branch A] Processing issue #${currentIssue.number} on action: ${action}`);

              const currentLabels = currentIssue.labels.map(l => (typeof l === 'string' ? l : l.name));
              const state = await evaluateIssueBlockedState(currentIssue);
              console.log(`Issue #${currentIssue.number} evaluation: isBlocked=${state.isBlocked}, blockers=[${state.blockers.join(', ')}], open=[${state.openBlockers.join(', ')}]`);

              if (state.isBlocked) {
                // Remove 'status: ready' if present
                if (currentLabels.includes('status: ready')) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: currentIssue.number,
                      name: 'status: ready'
                    });
                  } catch (e) {
                    console.log(`Notice removing ready: ${e.message}`);
                  }
                }

                // Add 'status: blocked' if missing
                if (!currentLabels.includes('status: blocked')) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: currentIssue.number,
                    labels: ['status: blocked']
                  });
                }

                // Move project card to Backlog
                await setProjectStatus(currentIssue.node_id, 'Backlog');
              } else {
                // Only mark Ready if not in-progress or in-review
                if (!currentLabels.includes('status: in-progress') && !currentLabels.includes('status: in-review')) {
                  // Remove 'status: blocked' if present
                  if (currentLabels.includes('status: blocked')) {
                    try {
                      await github.rest.issues.removeLabel({
                        owner,
                        repo,
                        issue_number: currentIssue.number,
                        name: 'status: blocked'
                      });
                    } catch (e) {
                      console.log(`Notice removing blocked: ${e.message}`);
                    }
                  }

                  // Add 'status: ready' if missing
                  if (!currentLabels.includes('status: ready')) {
                    await github.rest.issues.addLabels({
                      owner,
                      repo,
                      issue_number: currentIssue.number,
                      labels: ['status: ready']
                    });
                  }

                  // Move project card to Ready
                  await setProjectStatus(currentIssue.node_id, 'Ready');
                }
              }
              return;
            }

            // Branch B: Triggered when an issue is closed or on manual workflow_dispatch
            console.log(`[Branch B] Scanning open issues to unblock and sync...`);
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open'
            });

            const openIssues = allIssues.filter(item => !item.pull_request);
            console.log(`Found ${openIssues.length} open issues to inspect.`);

            for (const issue of openIssues) {
              const currentLabels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));

              // Skip issues that are already in progress or in review
              if (currentLabels.includes('status: in-progress') || currentLabels.includes('status: in-review')) {
                console.log(`Issue #${issue.number} is ${currentLabels.join(', ')}. Skipping.`);
                continue;
              }

              const state = await evaluateIssueBlockedState(issue);

              if (state.isBlocked) {
                // Ensure label is blocked and card is in Backlog
                if (!currentLabels.includes('status: blocked')) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: ['status: blocked']
                  });
                }
                if (currentLabels.includes('status: ready')) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: issue.number,
                      name: 'status: ready'
                    });
                  } catch (e) {
                    console.log(`Notice removing ready: ${e.message}`);
                  }
                }
                await setProjectStatus(issue.node_id, 'Backlog');
              } else {
                // All blockers closed -> Unblock to Ready
                const wasBlocked = currentLabels.includes('status: blocked');

                if (wasBlocked) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: issue.number,
                      name: 'status: blocked'
                    });
                  } catch (e) {
                    console.log(`Notice removing blocked: ${e.message}`);
                  }
                }

                if (!currentLabels.includes('status: ready')) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: ['status: ready']
                  });
                }

                // Move project card to Ready
                await setProjectStatus(issue.node_id, 'Ready');

                // If issue was previously blocked, post notification comment
                if (wasBlocked) {
                  const assignees = issue.assignees || [];
                  const mentionString = assignees.length > 0 
                    ? assignees.map(a => `@${a.login}`).join(' ')
                    : 'nhóm phát triển';

                  const comments = await github.paginate(github.rest.issues.listComments, {
                    owner,
                    repo,
                    issue_number: issue.number
                  });

                  const alreadyCommented = comments.some(c => c.body && c.body.includes('🔓 **Unblocked & Ready!**'));
                  if (!alreadyCommented) {
                    const commentBody = `🔓 **Unblocked & Ready!** Tất cả các task phụ thuộc tiên quyết đã hoàn thành. Task này đã được tự động chuyển sang trạng thái **Ready**.\ncc: ${mentionString} đã có thể bắt đầu tạo branch và triển khai!`;
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: commentBody
                    });
                    console.log(`Posted unblock comment on Issue #${issue.number}`);
                  }
                }
              }
            }
